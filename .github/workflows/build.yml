name: CI

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.package.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: rootless
            make_args: ROOTLESS=1
          - name: roothide
            make_args: ROOTHIDE=1
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Procursus
      uses: beerpiss/procursus-action@v2
      with:
        packages: ldid xz-utils cmark make
        cache: true
        cache-path: ~/__cache
    - name: Set up Theos
      run: git clone --recursive --depth=1 'https://github.com/theos/theos.git' ~/theos
    - name: Compile
      id: package_build
      run: |
        gmake package THEOS=~/theos ${{ matrix.package.make_args }}
        echo "package=$(cat .theos/last_package)" >> $GITHUB_OUTPUT
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NewTerm3-${{ matrix.package.name }}
        path: '${{ steps.package_build.outputs.package }}'
        if-no-files-found: error
